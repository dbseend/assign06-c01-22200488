<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도서 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-5">
    <div class="card card-table form-card">
        <div class="card-body p-4">
            <h1 class="h4 page-title mb-4"><a th:href="@{/books}" class="text-decoration-none text-reset">📖 도서 등록</a></h1>

            <!-- name 속성 = BookRequest 필드명 (title, author, price, category, isbn) -->
            <form th:action="@{/books}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="author" class="form-label">저자</label>
                    <input type="text" class="form-control" id="author" name="author" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">가격(원)</label>
                        <input type="number" class="form-control" id="price" name="price" min="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">카테고리</label>
                        <input type="text" class="form-control" id="category" name="category" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="isbn" class="form-label">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">등록</button>
                    <a th:href="@{/books}" class="btn btn-outline-secondary">목록으로</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
