<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도서 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 page-title mb-0"><a th:href="@{/books}" class="text-decoration-none text-reset">📚 도서 목록</a></h1>
        <a th:href="@{/books/new}" class="btn btn-primary">+ 신규 등록</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${message}">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
    </div>

    <div class="card card-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>제목</th><th>저자</th><th class="text-end">가격</th><th>카테고리</th><th>ISBN</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td class="text-end" th:text="${#numbers.formatInteger(book.price, 3, 'COMMA')} + '원'"></td>
                    <td><span class="badge text-bg-secondary" th:text="${book.category}"></span></td>
                    <td th:text="${book.isbn}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="text-center text-muted py-5">등록된 도서가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-3 mb-0" th:text="'총 ' + ${#lists.size(books)} + '권'"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
